org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# --- CI/parallel build performance ---
# Run independent Gradle tasks in parallel.
org.gradle.parallel=true
# Reuse task outputs from previous builds (works with actions/cache).
org.gradle.caching=true
# Configuration cache DISABLED: Flutter Gradle Plugin's DebugMinSdkCheck task
# and KGP (Kotlin Gradle Plugin) hold non-serializable objects (Project,
# ConfigurationContainer, DependencyHandler, WeakHashMap/ReferenceQueue),
# which configuration cache cannot serialize. See Gradle 9.x config cache
# requirements: disallowed types. Keeping this false ensures builds succeed.
org.gradle.configuration-cache=false
# No daemon in CI (each job is a fresh container; daemon only wastes startup).
org.gradle.daemon=false
