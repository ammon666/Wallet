name: Build Debug APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter Version
        run: flutter --version

      # Cache pub packages (~/.pub-cache) keyed on pubspec.lock hash.
      # Hit on unchanged deps -> skips re-downloading all Dart packages.
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Cache Gradle caches + wrapper dists. Hit on unchanged Gradle/AGP deps
      # -> skips re-downloading & extracting hundreds of MB of Android deps.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/**/*.gradle*', '**/android/**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get Dependencies
        run: flutter pub get

      # Build only arm64-v8a (modern 64-bit ARM, covers 95%+ of Android phones).
      # Default debug build produces a fat APK with 3 ABIs; targeting one cuts
      # native compile time roughly by two-thirds.
      # To test on an x86_64 emulator instead, switch to: android-x64
      - name: Build Debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
