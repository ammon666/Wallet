name: Build Release APK

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Flutter Version
        run: flutter --version

      # Cache pub packages (~/.pub-cache) keyed on pubspec.lock hash.
      # Hit on unchanged deps -> skips re-downloading all Dart packages.
      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool/
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # Cache Gradle caches + wrapper dists. Hit on unchanged Gradle/AGP deps
      # -> skips re-downloading & extracting hundreds of MB of Android deps.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/android/**/*.gradle*', '**/android/**/gradle-wrapper.properties', '**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Get Dependencies
        run: flutter pub get

      # Decode the release keystore (base64 in GitHub Secrets) → android/app/release.jks
      # AND write android/key.properties (gitignored) so Gradle can sign the release APK.
      #
      # WHY PYTHON FOR EVERYTHING (not just keystore decode):
      #   The previous version wrote key.properties with a bash heredoc (<<EOF),
      #   which lets bash expand $VAR, `cmd`, and \x inside password values.
      #   If KEY_PASSWORD contains e.g. "pa$$word", bash expands $$ → PID, and
      #   the written password no longer matches the keystore →
      #   "DerInputStream.getLength(): lengthTag=109, too big" at packageRelease.
      #   Python reads os.environ verbatim — no shell expansion — so passwords
      #   pass through byte-exact.
      #
      # VERIFICATION: After writing the files, we run keytool -list (verifies
      # store password + alias) and jarsigner on a test JAR (verifies key
      # password). This catches mismatched secrets BEFORE the 3-minute Flutter
      # build, with a clear error message instead of a cryptic Gradle failure.
      #
      # Local dev: place release.jks at android/app/release.jks and create
      # android/key.properties manually with the same four keys.
      - name: Decode Keystore, Write key.properties & Verify
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, binascii, os, sys, pathlib, subprocess, tempfile, hashlib

          # ================================================================
          # 1. Decode keystore from base64 (GitHub Secret → .jks file)
          # ================================================================
          raw = os.environ.get("KEYSTORE_BASE64", "")
          if not raw:
              sys.exit("KEYSTORE_BASE64 is empty — did you set the GitHub Secret?")
          # Strip any whitespace/newlines the user may have accidentally pasted.
          compact = "".join(raw.split())
          try:
              data = base64.b64decode(compact, validate=True)
          except binascii.Error as e:
              sys.exit(f"KEYSTORE_BASE64 is not valid base64: {e}")
          if len(data) < 100:
              sys.exit(f"Decoded keystore is only {len(data)} bytes — too small "
                       "for a real JKS. Check that the secret holds the FULL "
                       "base64 output of release.jks.")
          # JKS (Sun) magic: bytes 0..3 == FE ED FE ED
          if data[:4] != b"\xfe\xed\xfe\xed":
              head = " ".join(f"{b:02X}" for b in data[:8])
              sys.exit(
                  "Decoded keystore does NOT start with JKS magic (FEEDFEED).\n"
                  "First 8 bytes: " + head + "\n"
                  "Likely causes:\n"
                  "  1) You pasted a .p12 (PKCS#12) but Gradle loads it as JKS.\n"
                  "     Regenerate with: keytool -genkeypair -storetype jks ...\n"
                  "  2) The base64 was truncated or a wrong file was encoded.\n"
                  "     Re-encode the FULL file and paste into KEYSTORE_BASE64."
              )
          ks_path = pathlib.Path("android/app/release.jks")
          ks_path.parent.mkdir(parents=True, exist_ok=True)
          ks_path.write_bytes(data)
          sha = hashlib.sha256(data).hexdigest()
          print(f"✓ Keystore decoded: {len(data)} bytes, SHA-256 = {sha[:16]}...")

          # ================================================================
          # 2. Read passwords from env (Python = verbatim, no shell expansion)
          # ================================================================
          store_pass = os.environ.get("KEYSTORE_PASSWORD", "")
          key_alias  = os.environ.get("KEY_ALIAS", "")
          key_pass   = os.environ.get("KEY_PASSWORD", "")

          if not store_pass:
              sys.exit("KEYSTORE_PASSWORD is empty — did you set the GitHub Secret?")
          if not key_alias:
              sys.exit("KEY_ALIAS is empty — did you set the GitHub Secret?")
          if not key_pass:
              sys.exit("KEY_PASSWORD is empty — did you set the GitHub Secret?")

          # Log metadata (NOT actual values) for debugging.
          def ws_warn(v):
              return " ⚠ has leading/trailing whitespace!" if v != v.strip() else ""
          print(f"  KEYSTORE_PASSWORD: {len(store_pass)} chars{ws_warn(store_pass)}")
          print(f"  KEY_ALIAS:         '{key_alias}' ({len(key_alias)} chars)")
          print(f"  KEY_PASSWORD:      {len(key_pass)} chars{ws_warn(key_pass)}")
          if store_pass != store_pass.strip() or key_pass != key_pass.strip():
              print("\n⚠ WARNING: A password has leading/trailing whitespace.")
              print("  This usually means the secret was copy-pasted with extra")
              print("  spaces/newlines. Go to GitHub → Settings → Secrets and")
              print("  re-paste the password WITHOUT trailing whitespace.\n")

          # ================================================================
          # 3. Verify STORE password + alias with keytool.
          # ================================================================
          print("\n--- keytool: verifying store password & alias ---")
          r = subprocess.run(
              ["keytool", "-list",
               "-keystore", str(ks_path),
               "-storepass", store_pass],
              capture_output=True, text=True
          )
          print(r.stdout)
          if r.returncode != 0:
              print(r.stderr)
              sys.exit(
                  "❌ keytool -list FAILED → KEYSTORE_PASSWORD is wrong.\n"
                  "   The keystore file is valid (JKS magic OK), but the store\n"
                  "   password doesn't match. Update the KEYSTORE_PASSWORD\n"
                  "   GitHub Secret to the password used when creating release.jks."
              )
          r2 = subprocess.run(
              ["keytool", "-list",
               "-keystore", str(ks_path),
               "-storepass", store_pass,
               "-alias", key_alias],
              capture_output=True, text=True
          )
          if r2.returncode != 0:
              print(r2.stderr)
              sys.exit(
                  f"❌ Alias '{key_alias}' not found in keystore.\n"
                  f"   Run this locally to list aliases:\n"
                  f"     keytool -list -keystore release.jks -storepass <password>\n"
                  f"   Then update the KEY_ALIAS GitHub Secret accordingly."
              )
          print(f"✓ Alias '{key_alias}' exists in keystore.")

          # ================================================================
          # 4. Verify KEY password by signing a throwaway test JAR.
          #    keytool -list only checks the store password — the key
          #    password is separate and must also be correct. jarsigner
          #    needs BOTH, so a successful sign proves both are right.
          #
          #    FALLBACK: If KEY_PASSWORD fails, retry with KEYSTORE_PASSWORD.
          #    This handles the common case where the keystore uses the SAME
          #    password for store and key, but the two GitHub Secrets differ
          #    slightly (trailing whitespace, a typo, etc.). The verified
          #    password is then written to key.properties so Gradle signs
          #    with the one that actually works.
          # ================================================================
          print("\n--- jarsigner: verifying key password ---")

          def try_sign(kp):
              with tempfile.TemporaryDirectory() as td:
                  jar_path = pathlib.Path(td) / "test.jar"
                  txt_path = pathlib.Path(td) / "test.txt"
                  txt_path.write_text("signing-test")
                  subprocess.run(
                      ["jar", "cf", str(jar_path), "-C", td, "test.txt"],
                      check=True, capture_output=True
                  )
                  return subprocess.run(
                      ["jarsigner",
                       "-keystore", str(ks_path),
                       "-storepass", store_pass,
                       "-keypass", kp,
                       str(jar_path), key_alias],
                      capture_output=True, text=True
                  )

          r3 = try_sign(key_pass)
          verified_key_pass = key_pass
          if r3.returncode != 0:
              print(f"  ✗ KEY_PASSWORD rejected: {r3.stderr.strip()}")
              if key_pass != store_pass:
                  # Retry with the store password — the keystore may share
                  # one password for both entries while the Secrets differ.
                  print("  ↳ Retrying with KEYSTORE_PASSWORD as key password "
                        "(store=key fallback)...")
                  r3 = try_sign(store_pass)
                  if r3.returncode == 0:
                      verified_key_pass = store_pass
                      print("  ✓ Fallback succeeded — using KEYSTORE_PASSWORD "
                            "as the key password.")
                  else:
                      print(f"  ✗ KEYSTORE_PASSWORD also rejected: "
                            f"{r3.stderr.strip()}")
                      sys.exit(
                          "❌ jarsigner FAILED with BOTH KEY_PASSWORD and\n"
                          "   KEYSTORE_PASSWORD. The keystore's key entry\n"
                          "   accepts neither GitHub Secret.\n"
                          "   The keystore was created with a key password\n"
                          "   that differs from the store password (likely\n"
                          "   shell expansion of '!!' or special chars during\n"
                          "   keytool -genkeypair). Fix by EITHER:\n"
                          "     1. Regenerating the keystore with identical\n"
                          "        store/key passwords (press RETURN at the\n"
                          "        'Enter key password' prompt), OR\n"
                          "     2. Changing the key password locally:\n"
                          "        keytool -keypasswd -keystore release.jks\n"
                          "          -alias <KEY_ALIAS>\n"
                          "        (enter store pw, then old key pw, then the\n"
                          "        new key pw = store pw)\n"
                          "     Then re-encode the keystore to base64 and\n"
                          "     update the KEYSTORE_BASE64 GitHub Secret."
                      )
              else:
                  # KEY_PASSWORD == KEYSTORE_PASSWORD in Secrets, so the
                  # fallback cannot help — the keystore genuinely has a
                  # different key password.
                  sys.exit(
                      "❌ jarsigner FAILED → key password is wrong.\n"
                      "   KEY_PASSWORD and KEYSTORE_PASSWORD have the SAME\n"
                      "   value in GitHub Secrets, but the keystore's key\n"
                      "   entry rejects it. The keystore was created with a\n"
                      "   DIFFERENT key password (e.g. shell expanded '!!' or\n"
                      "   other special chars during keytool -genkeypair).\n"
                      "   Fix by EITHER:\n"
                      "     1. Regenerating the keystore (press RETURN at the\n"
                      "        'Enter key password' prompt to reuse the store\n"
                      "        password), OR\n"
                      "     2. Changing the key password to match the store:\n"
                      "        keytool -keypasswd -keystore release.jks\n"
                      "          -alias <KEY_ALIAS>\n"
                      "     Then re-encode to base64 and update KEYSTORE_BASE64."
                  )
          print("✓ Key password verified — test JAR signed successfully!")

          # ================================================================
          # 5. Write key.properties via Python (NOT bash heredoc).
          #    Uses the VERIFIED key password — which may be KEYSTORE_PASSWORD
          #    if the store=key fallback succeeded. Escape backslashes for
          #    Java Properties format (\ → \\).
          # ================================================================
          def esc(v):
              return v.replace("\\", "\\\\")
          props = pathlib.Path("android/key.properties")
          props.write_text(
              f"storeFile=release.jks\n"
              f"storePassword={esc(store_pass)}\n"
              f"keyAlias={esc(key_alias)}\n"
              f"keyPassword={esc(verified_key_pass)}\n"
          )
          print(f"✓ Wrote {props}")
          print("\n✅ All keystore checks passed. Ready to build.")
          PY

      # Build only arm64-v8a (modern 64-bit ARM, covers 95%+ of Android phones).
      # Release build uses Dart AOT compilation (faster, smaller than debug).
      - name: Build Release APK
        run: flutter build apk --release --target-platform android-arm64

      # Print the APK signing certificate fingerprints (SHA-1/SHA-256) so they
      # can be registered with app stores / 3rd-party platforms (WeChat, maps,
      # etc.). apksigner reads v2/v3 signatures (keytool only reads v1).
      # continue-on-error: this is informational only; never block the build.
      - name: Print Signing Certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk
          else
            keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk || true
          fi

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
